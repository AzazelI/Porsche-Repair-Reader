# Trigger rebuild with updated HF_TOKEN
name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  # Allows manual triggers from the Actions tab on GitHub
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir deploy_dir
          cp -r backend deploy_dir/
          cp Dockerfile deploy_dir/
          cp README.md deploy_dir/
          cd deploy_dir
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote add hf https://AzazeI:$HF_TOKEN@huggingface.co/spaces/AzazeI/porsche-repair-reader
          git checkout -b main
          git add .
          git commit -m "deploy: update backend code and configuration"
          git push --force hf main

