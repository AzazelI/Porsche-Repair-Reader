name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  # Allows manual triggers from the Actions tab on GitHub
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://Azazel:$HF_TOKEN@huggingface.co/spaces/Azazel/porsche-repair-reader
          git push --force hf HEAD:refs/heads/main
